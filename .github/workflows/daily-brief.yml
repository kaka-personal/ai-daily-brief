name: AI Daily Brief

on:
  # The main trigger is the self-dispatch chain in the "next" job below: every run starts the
  # following one about 15 minutes later. The schedule is only a backup that can restart the chain,
  # because GitHub has not been firing it for this repository.
  # To stop the chain, cancel the running run or disable the workflow in the Actions tab.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write

# One run at a time and at most one pending: a newer pending run replaces an older one,
# so manual or scheduled runs merge into the chain instead of forking a second one.
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.brief.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: brief
        run: npm run brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit brief archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "chore: daily brief $(date -u +%F)" && git push)

  deploy:
    needs: brief
    if: needs.brief.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4

  next:
    needs: [brief, deploy]
    # Keep the chain alive when the brief or the deploy failed or was skipped;
    # cancelling a run stops the chain.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait before the next check
        run: sleep 780
      - name: Start the next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            gh workflow run daily-brief.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0
            sleep 30
          done
          exit 1
