name: AI Daily Brief

on:
  # The main trigger is the self-dispatch chain in the "next" job below: every run waits until the
  # next slot (08:00, 12:00, 18:00 Beijing time) and starts the following run. Jobs are capped at
  # 6 hours, so a longer gap (18:00 -> 08:00) is bridged by "wait" runs that only continue the chain.
  # The schedule is only a backup that can restart the chain, because GitHub has not been firing it
  # for this repository.
  # To stop the chain, cancel the running run or disable the workflow in the Actions tab.
  schedule:
    - cron: "7 0,4,10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "brief: check for news; wait: only continue the chain"
        type: choice
        options: [brief, wait]
        default: brief

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write

jobs:
  brief:
    if: inputs.mode != 'wait'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Briefs run one at a time; the waiting "next" job below does not block manual runs.
    concurrency:
      group: daily-brief
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.brief.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: brief
        run: npm run brief
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit brief archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "chore: daily brief $(date -u +%F)" && git push)

  deploy:
    needs: brief
    if: needs.brief.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: daily-brief-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4

  next:
    needs: [brief, deploy]
    # Keep the chain alive when the brief or the deploy failed or was skipped;
    # cancelling a run stops the chain.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # A newer waiting job replaces an older one, so manual runs never fork a second chain.
    concurrency:
      group: daily-brief-next
      cancel-in-progress: true
    steps:
      - name: Wait for the next slot
        id: wait
        run: |
          now=$(date +%s)
          # Next slot at least 5 minutes away. Slots in UTC: 00, 04, 10 = 08:00, 12:00, 18:00 Beijing (UTC+8, no DST).
          for day in 0 1; do
            for hour in 00 04 10; do
              t=$(date -u -d "$(date -u -d "+$day day" +%F) $hour:00" +%s)
              if [ "$t" -gt $((now + 300)) ]; then target=$t; break 2; fi
            done
          done
          wait=$((target - now))
          max=19800 # 5.5 hours; jobs are capped at 6
          if [ "$wait" -gt "$max" ]; then mode=wait; wait=$max; else mode=brief; fi
          echo "Next slot $(date -u -d "@$target" '+%F %H:%M') UTC, sleeping ${wait}s, then mode=$mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          sleep "$wait"
      - name: Start the next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            gh workflow run daily-brief.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=${{ steps.wait.outputs.mode }} && exit 0
            sleep 30
          done
          exit 1
